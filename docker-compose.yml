version: '3'

services:

  auth-service:
    build: ./services/auth-service
    ports:
      - "3001:3001"

  qr-service:
    build: ./services/qr-service
    ports:
      - "3002:3002"

  communication-service:
    build: ./services/communication-service
    ports:
      - "3005:3005"

  postgres:
    image: postgres:16

  redis:
    image: redis

  rabbitmq:
    image: rabbitmq:3-management